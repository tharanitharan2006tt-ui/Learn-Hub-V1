<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create an account — LearnHub</title><link rel="stylesheet" href="../CSS/style.css"><script defer src="../JAVASCRIPT/scripts.js"></script></head><body data-root="../"><header class="site_header"><nav class="navbar" aria-label="Main navigation"><a class="brand" data-nav="home">Learn<span>Hub</span></a><div class="nav_links"><a data-nav="home">Home</a><a data-nav="courses">Courses</a><a data-nav="my_learning">My Learning</a></div><div class="nav_actions"><a class="nav_login" data-nav="login">Log in</a></div></nav></header><main class="auth_section"><section class="auth_container"><h1>Create your account</h1><p>Join LearnHub and start your learning journey.</p><form id="register-form"><div class="form_group"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required minlength="2"></div><div class="form_group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form_group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"></div><div class="form_group"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Enter your password again" required minlength="8"></div><button class="button_link" type="submit">Create account</button></form><p class="auth_switch">Already have an account? <a data-nav="login">Log in</a></p></section></main></body></html>
